registry_version: 1.0.0
research_snapshot: 2026-11-21
scope:
  operating_systems: [Debian 13 Trixie, Ubuntu 26.04 LTS, Ubuntu 24.04 LTS]
  architecture_priority: [x86_64, aarch64]
  project: Agent 2 forensic motion reconstruction and preset engineering
  note: >-
    Registry entries are package recommendations, not a unified install lock. Verify
    package versions, OS/GPU support, checkpoint terms and model availability before
    enabling a capability. Python environments must be isolated by compatibility profile.

install_policy:
  host: apt
  python: uv-or-micromamba
  node: Node.js 26 LTS with package lock
  blender: official versioned Linux distribution; bundled Python for bpy
  models: pin repository revision and SHA-256; record weight license/access terms
  no_global_pip: true
  no_unqualified_latest: true

operating_systems:
  preferred:
    - Debian 13.7
    - Ubuntu 26.04 LTS
  compatibility_fallback:
    - Ubuntu 24.04 LTS
  development_only:
    - Ubuntu 26.10 interim
  notes:
    - Debian 13 and Ubuntu 26.04 are in current CUDA/ROCm support materials, but exact GPU/kernel compatibility still matters.
    - Playwright's current documented Linux matrix includes Debian 12/13 and Ubuntu 22.04/24.04/26.04.

environments:
  - id: media-core
    python: "3.12"
    packages: [av, numpy, scipy, opencv-contrib-python-headless, pillow, scikit-image, scenedetect, pydantic, jsonschema, pyarrow, duckdb]
  - id: vision-torch
    python: "3.12"
    packages: [torch, torchvision, transformers, accelerate, safetensors, huggingface-hub, einops, kornia]
    note: Install torch/torchvision first using the official platform selector; pin CUDA/ROCm build.
  - id: sam3-worker
    python: "3.12+"
    packages: [sam3-from-upstream-source]
    note: Separate environment; current upstream instructions specify a CUDA-capable GPU and compatible PyTorch.
  - id: sam2-worker
    python: "3.10+"
    packages: [sam2-from-upstream-source]
    note: Separate environment from SAM 3 unless the complete dependency graph is tested.
  - id: ocr-worker
    python: "3.10-3.12 as supported by current Paddle wheels"
    packages: [paddlepaddle-or-paddlepaddle-gpu, paddleocr, pytesseract]
    note: Paddle GPU wheels use Paddle's package indexes and CUDA compatibility guidance.
  - id: reconstruction-3d
    python: "3.12 where supported"
    packages: [pycolmap, open3d, trimesh, pymeshlab, pyvista]
    note: COLMAP itself may be a native executable/source build; default distro builds may lack CUDA/HIP.
  - id: audio-analysis
    python: "3.12"
    packages: [librosa, essentia, faster-whisper, pyannote-audio, torchaudio]
  - id: qa-browser
    python: "3.12"
    packages: [playwright, pytest, pytest-playwright, hypothesis, pytest-cov, ruff]
  - id: web-render
    runtime: Node.js 26 LTS
    packages: [three, pixi.js, gsap, vite, vite-plugin-singlefile, playwright]
  - id: blender
    runtime: Blender bundled Python
    packages: [bpy, mathutils, bmesh]
    note: bpy/mathutils are Blender application modules; do not mix with system Python ABI.

capabilities:
  media_ingest:
    priority: P0
    packages:
      - {name: FFmpeg, id: ffmpeg, install: apt-or-upstream, role: demux-decode-encode-filter, url: https://ffmpeg.org/}
      - {name: ffprobe, id: ffmpeg, install: same-as-ffmpeg, role: stream-metadata-and-timing-probe, url: https://ffmpeg.org/ffprobe.html}
      - {name: PyAV, id: av, install: uv, role: PTS-timebase-aware-decoding, url: https://pyav.org/docs/stable/}
      - {name: PySceneDetect, id: scenedetect, install: uv, role: candidate-cut-and-transition-detection, url: https://www.scenedetect.com/}
      - {name: GStreamer, id: gstreamer1.0, install: apt-and-plugins, role: streaming-pipelines-and-hardware-codecs, url: https://gstreamer.freedesktop.org/documentation/}
      - {name: VapourSynth, id: vapoursynth, install: uv-or-native-build, role: programmable-frame-server, url: https://www.vapoursynth.com/doc/}
      - {name: OpenTimelineIO, id: opentimelineio, install: uv, role: editorial-timeline-interchange, url: https://opentimeline.io/}
      - {name: MediaInfo, id: mediainfo, install: apt, role: secondary-media-metadata, url: https://mediaarea.net/MediaInfo}
      - {name: ExifTool, id: libimage-exiftool-perl, install: apt, role: asset-metadata, url: https://exiftool.org/}
      - {name: zimg, id: zimg, install: apt-or-source, role: colour-and-pixel-format-conversion, url: https://github.com/sekrit-twc/zimg}
      - {name: libplacebo, id: libplacebo, install: apt-or-source, role: shader-based-scaling-and-tonemapping, url: https://github.com/haasn/libplacebo}
  classical_cv:
    priority: P0
    packages:
      - {name: OpenCV contrib, id: opencv-contrib-python-headless, install: uv-or-source, role: tracking-flow-calibration-contours, url: https://opencv.org/}
      - {name: NumPy, id: numpy, install: uv, role: array-computation, url: https://numpy.org/}
      - {name: SciPy, id: scipy, install: uv, role: optimization-filtering-interpolation, url: https://scipy.org/}
      - {name: scikit-image, id: scikit-image, install: uv, role: structural-and-pixel-metrics, url: https://scikit-image.org/}
