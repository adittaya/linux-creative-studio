license_policy:
  mandatory_fields: [code_license, model_weight_license, dataset_license, font_asset_license, redistribution_permission]
  rule: >-
    Review code, checkpoint, data and font licences independently. A model's source-code
    license does not automatically grant unrestricted checkpoint or commercial rights.
