# Central studio configuration. Values here are declarative defaults.
schema_version: "1.0"
name: "Linux Creative Studio"
root: "."
cli: "./studioctl"
registry:
  applications: "registry/applications.json"
  capabilities: "registry/capabilities.json"
  dependencies: "registry/dependencies.json"
  compatibility: "registry/compatibility.json"
  profiles: "registry/task-profiles.json"
policies:
  offline_first: true
  verify_downloads: true
  checksum_algorithm: "sha256"
  allow_https_only: true
  forbid_system_library_replacement: true
  forbid_arbitrary_model_commands: true
  require_confirm_for_system_changes: true
  separate_commercial_packages: true
status_vocabulary:
  - not-tested
  - installed
  - verified
  - offline-verified
  - partially-verified
  - incompatible
  - unavailable
  - not-redistributable
