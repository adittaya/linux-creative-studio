schema_version: "1.0"
blender:
  engine_default: "CYCLES"
  preview_engine: "BLENDER_EEVEE_NEXT"
  cpu_threads: "auto"
  tile_size: "auto"
  denoise: "OIDN where available"
  color_management:
    view_transform: "AgX"
    look: "AgX - Medium High Contrast"
    display_device: "sRGB"
    sequence: "ACEScg for VFX interchange"
remotion:
  concurrency: 4
  image_format: "png"
  codec: "h264"
  crf: 18
  browser_executable: "runtimes/browsers/chrome-headless-shell"
ffmpeg:
  delivery_h264: "libx264 -crf 18 -preset medium -pix_fmt yuv420p"
  delivery_prores: "-c:v prores_ks -profile:v 3"
  lossless_exr: "-c:v exr -pix_fmt gbrpf32le"
  audio: "-c:a aac -b:a 192k"
  fast_preview: "-preset ultrafast -crf 28"
natron:
  color_config: "use pinned OCIO config from packages/color/aces"
  bit_depth: "32-bit float EXR"
