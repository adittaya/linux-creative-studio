schema_version: "1.0"
ux:
  default_json_output_for_agents: true
  default_dry_run_for_system_changes: true
  confirm_destructive_actions: true
isolation:
  custom_desktop_launchers_directory: "~/.local/share/applications/linux-creative-studio"
  never_overwrite_user_config: true
  user_data_separate_from_package_config: true
network:
  studioctl_uses_network: false
  downloader_https_only: true
logging:
  level: "info"
  file: "logs/studio.log"
  retain_days: 90
 creative_defaults:
  sequence_exchange: "EXR 16/32-bit half/float"
  intermediate_codec: "ProRes/DNxHR where licensed codecs are available"
  delivery: "H.264/AAC or VP9/Opus"
  color: "scene-referred ACEScg/AgX unless client specifies otherwise"
