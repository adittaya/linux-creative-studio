schema_version: "1.0"
detection:
  script_system: "scripts/detect-system.sh"
  script_hardware: "scripts/detect-hardware.sh"
profiles:
  minimal:
    ram_gb_min: 4
    disk_gb_estimate: 4
    gpu: "not-required"
  standard:
    ram_gb_min: 8
    disk_gb_estimate: 25
    gpu: "optional"
  full-studio:
    ram_gb_min: 16
    disk_gb_estimate: 90
    gpu: "recommended"
  rendering-workstation:
    ram_gb_min: 32
    disk_gb_estimate: 120
    gpu: "strongly-recommended"
  video-production:
    ram_gb_min: 16
    disk_gb_estimate: 35
    gpu: "optional; hardware encode useful"
  ai-automation-workstation:
    ram_gb_min: 16
    disk_gb_estimate: 40
    gpu: "optional"
gpu_vendors:
  nvidia: "detect only; never auto-install proprietary driver"
  amd: "detect only; Mesa/ROCm availability varies"
  intel: "detect only; Mesa/oneAPI availability varies"
  cpu-only: "supported fallback for Blender Cycles, FFmpeg and Remotion"
required_checks:
  - glibc_version
  - opengl_or_vulkan
  - hardware_video_encode
  - free_disk
  - ram
